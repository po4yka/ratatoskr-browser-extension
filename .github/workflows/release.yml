name: extension store release

on:
  workflow_dispatch:
    inputs:
      publish_chromium:
        description: Publish the uploaded Chromium package after validation
        required: true
        default: false
        type: boolean

permissions:
  contents: read

concurrency:
  group: extension-store-release
  cancel-in-progress: false

jobs:
  chromium:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    environment: extension-stores
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci
      - run: npm run build
      - run: npm run package
      - run: npm run package:smoke
      - run: npm run store-assets
      - run: npm run release:check
      - name: Upload Chromium package
        if: ${{ !inputs.publish_chromium }}
        run: npm run release:upload -- --store chromium --execute
        env:
          CWS_CLIENT_ID: ${{ secrets.CWS_CLIENT_ID }}
          CWS_CLIENT_SECRET: ${{ secrets.CWS_CLIENT_SECRET }}
          CWS_REFRESH_TOKEN: ${{ secrets.CWS_REFRESH_TOKEN }}
          CWS_PUBLISHER_ID: ${{ secrets.CWS_PUBLISHER_ID }}
          CWS_EXTENSION_ID: ${{ secrets.CWS_EXTENSION_ID }}
      - name: Upload and publish Chromium package
        if: ${{ inputs.publish_chromium }}
        run: npm run release:upload -- --store chromium --execute --publish
        env:
          CWS_CLIENT_ID: ${{ secrets.CWS_CLIENT_ID }}
          CWS_CLIENT_SECRET: ${{ secrets.CWS_CLIENT_SECRET }}
          CWS_REFRESH_TOKEN: ${{ secrets.CWS_REFRESH_TOKEN }}
          CWS_PUBLISHER_ID: ${{ secrets.CWS_PUBLISHER_ID }}
          CWS_EXTENSION_ID: ${{ secrets.CWS_EXTENSION_ID }}

  firefox:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    environment: extension-stores
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci
      - run: npm run build
      - run: npm run package
      - run: npm run package:smoke
      - run: npm run store-assets
      - run: npm run release:check
      - name: Sign and upload Firefox package
        run: npm run release:upload -- --store firefox --execute
        env:
          WEB_EXT_API_KEY: ${{ secrets.WEB_EXT_API_KEY }}
          WEB_EXT_API_SECRET: ${{ secrets.WEB_EXT_API_SECRET }}
