<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <title>Ratatoskr Options</title>
  </head>
  <body>
    <main>
      <h1>Ratatoskr Options</h1>
      <p aria-live="polite" data-role="status">Starting…</p>
      <section aria-labelledby="pairing-heading">
        <h2 id="pairing-heading">Pair device</h2>
        <form data-role="pairing-form"><label>Endpoint <input data-role="pairing-endpoint" type="url" required></label><label>Pairing code <input data-role="pairing-code" required></label><button type="submit">Pair device</button></form>
      </section>
      <section aria-labelledby="queue-heading">
        <h2 id="queue-heading">Capture queue</h2>
        <ul data-role="queue-list"></ul>
      </section>
    </main>
    <script src="./options.js"></script>
  </body>
</html>
