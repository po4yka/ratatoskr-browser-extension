<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <title>Ratatoskr</title>
  </head>
  <body>
    <main data-state="ready">
      <h1>Ratatoskr</h1>
      <form data-role="capture-form">
        <dl>
          <div>
            <dt>Page title</dt>
            <dd><output data-role="draft-title">Loading…</output></dd>
          </div>
          <div>
            <dt>URL</dt>
            <dd><output data-role="draft-url">Loading…</output></dd>
          </div>
          <div>
            <dt>Selected text</dt>
            <dd><output data-role="draft-selection">No selected text is available in the popup.</output></dd>
          </div>
        </dl>
        <button data-action="stage" type="submit">Stage capture</button>
      </form>
      <div data-role="save-actions">
        <button data-action="quick-save" disabled type="button">Quick save</button>
        <button data-action="tracked-save" disabled type="button">Tracked save</button>
      </div>
      <section data-role="operation-panel" hidden>
        <h2>Tracked save</h2>
        <output data-role="operation-progress">Waiting for Platform acceptance…</output>
        <a data-action="open-reader" hidden rel="noreferrer" target="_blank">Open reader</a>
        <button data-action="retry" hidden type="button">Retry save</button>
      </section>
      <p aria-live="polite" data-role="status">Loading the active page…</p>
    </main>
    <script src="./popup.js"></script>
  </body>
</html>
